name: live-update

on:
  schedule:
    - cron: "0 0 * * *"
  # Commits made with the default GITHUB_TOKEN don't retrigger push events,
  # so the activity job's own commit to main doesn't loop this workflow.
  push:
    branches: [main]
  workflow_dispatch: {}

# Two overlapping runs both try to push a README commit, and the loser fails on
# a non-fast-forward. Queue them instead: let the in-flight run finish rather
# than cancelling it, since it may already be mid-push.
concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: OfficialAbhinavSingh
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history needed by github-activity-readme
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # This action rewrites the README's activity section and pushes its own
      # commit, so it has to run *before* we touch the README — otherwise our
      # push lands first and this step's stale copy reverts the generated
      # upstream blocks.
      - uses: jamesgeorge007/github-activity-readme@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITTER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pick up the activity commit, so our own commit builds on it and the
      # push below is a fast-forward.
      - run: git pull --rebase --autostash
      # Regenerates neofetch-{dark,light}.svg and, from the same single pass
      # over UPSTREAM_REPOS, the README's upstream headline and contributions
      # table — one query, one number, so the card and the README agree.
      - id: render
        run: python3 scripts/update_neofetch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.render.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add neofetch-dark.svg neofetch-light.svg README.md
          git commit -m ":zap: Update neofetch stats card and upstream PR counts"
          git push
